  /* El panel no hace scroll: lo hace su contenido. En iOS un filtro SVG sobre un contenedor con
     scroll se cachea como capa y no se repinta al desplazarse —texto roto y fondo en blanco—, y con
     esto el filtro queda sobre un elemento quieto. La cabecera deja de necesitar sticky. */
  #panel{display:flex;flex-direction:column;overflow:hidden}
  #panel>header{position:static;top:auto;flex:0 0 auto}
  #panel-content{overflow:auto;overscroll-behavior:contain;flex:1 1 auto;min-height:0}
  .panel-note{font-size:.78rem;margin:6px 0 12px}.panel-row{padding:10px 0}.panel-row p{font-size:.78rem}.panel-row ul{padding-left:18px;font-size:.78rem}.memory-card{align-items:center}.memory-sprite{height:80px}
  .minigame-field [data-object]::before{content:'';display:block;width:38px;height:44px;margin:0 auto;background:currentColor;image-rendering:pixelated}
  /* Amabilidad: pista de caida. El cesto se dibuja en la misma banda que puntua el modulo
     (catchTop 80% a catchBottom 94%), asi que lo que se ve es exactamente lo que recoge. */
  .minigame-field.catch-field{display:block;min-height:0;padding:10px}
  .catch-lane{position:relative;width:100%;height:clamp(190px,38svh,260px);background:#e4ebcf;border:2px solid #52694a;overflow:hidden;touch-action:none;user-select:none}
  .catch-lane:focus-visible{outline:3px solid #263b30;outline-offset:-3px}
  /* Dos canales para la categoria, no solo la silueta: la lata va en tinta llena y las plantas en
     el verde claro del fondo de zona. Con un solo canal habia que leer la forma a 1,3 s de caida. */
  .catch-item{position:absolute;height:36px;translate:0 -50%;color:#263b30;pointer-events:none}
  .catch-item[data-kind="plant"]{color:#91a477}
  .catch-item::before{width:100%;height:36px;margin:0}
  .catch-basket{position:absolute;top:80%;height:10%;background:#c2d3a2;border:3px solid #263b30;border-top-width:7px;pointer-events:none}
  .catch-time{position:absolute;left:0;bottom:0;height:5px;background:#263b30;pointer-events:none}

<!-- Recarga automatica del servidor local. Solo existe sirviendo desde localhost: `HatchEnvironment`
     mira el hostname, asi que en produccion este bloque no hace ni una peticion. -->
<script>
(()=>{
 if(!globalThis.HatchEnvironment?.isDevelopmentEnvironment())return;
 let seen=null,fails=0;
 // Se pregunta cada segundo en vez de dejar la peticion abierta: una peticion aparcada impide que la
 // pagina llegue nunca a 'network idle', que es lo que esperan las herramientas de captura.
 const poll=async()=>{
  try{
   const response=await fetch('/__reload',{cache:'no-store'});
   if(!response.ok)return;                 // Sirviendo dist/: el endpoint no existe y se deja de sondear.
   const stamp=Number(await response.text());
   if(seen!==null&&stamp>seen){location.reload();return;}
   seen=stamp;fails=0;
  }catch{ if(++fails>5)return; }            // El servidor se ha parado: no insistir para siempre.
  setTimeout(poll,900);
 };
 addEventListener('load',()=>setTimeout(poll,900));
})();
</script>

function migrateSave(data){
  if(!data||typeof data!=='object')return data;
  if(!Number.isSafeInteger(data.coins)||data.coins<0)data.coins=0;
  normalizeRecords(data);
  if(!Array.isArray(data.gifts)||!data.gifts.every(id=>typeof id==='string'))data.gifts=[];
  if(typeof data.notice!=='string')data.notice=null;
  if(!data.pity||!Number.isSafeInteger(data.pity.low)||!Number.isSafeInteger(data.pity.since)||data.pity.low<0||data.pity.since<0)data.pity=freshPity();
  for(const gift of GIFTS)if(!data.gifts.includes(gift.id)){
    data.coins=Math.min(Number.MAX_SAFE_INTEGER,data.coins+gift.coins);
    data.gifts.push(gift.id);data.notice=gift.id;
  }
  // Las bayas de atributo se retiraron despues de estar en venta a 75 monedas, asi que las que un
  // jugador tuviera en la mochila se devuelven en monedas en vez de desaparecer. El resto de ids
  // retirados nunca se vendieron.
  const REFUNDED={berryStrength:75,berryIQ:75,berryKindness:75,berryStyle:75};
  for(const id of RETIRED_ITEM_IDS){
    if(data.inventory&&typeof data.inventory==='object'){
      const held=data.inventory[id];
      if(REFUNDED[id]&&Number.isSafeInteger(held)&&held>0)data.coins=Math.min(Number.MAX_SAFE_INTEGER,data.coins+held*REFUNDED[id]);
      delete data.inventory[id];
    }
    if(data.foundItem===id)data.foundItem=null;
  }
  const migrateIndividual=s=>{
    if(!s||typeof s!=='object')return;
    if(s.phase==='egg')s.personality=null;
    else if(!Object.hasOwn(PERSONALITY_CONFIG,s.personality))s.personality=Vital.personalityFor();
    Vital.ensureSleep(s,Number.isFinite(data.lastSync)?data.lastSync:Date.now());
  };
  migrateIndividual(data);
  if(Array.isArray(data.social?.memorials))data.social.memorials=data.social.memorials.filter(e=>e?.snapshot?.vital?.deathCause!=='neglect');
  // Shiny sightings recorded before they counted for the plain form are folded back into it.
  for(const entry of Object.values(data.pokedex||{})){
    const shiny=entry?.shiny;if(!shiny?.seen)continue;
    entry.seen=true;
    for(const id of shiny.ownedIds||[])if(!entry.ownedIds.includes(id))entry.ownedIds.push(id);
    for(const flag of ['evolved','bred','received'])if(shiny[flag])entry[flag]=true;
  }
  for(const memorial of data.social?.memorials||[])if(memorial?.snapshot)memorial.snapshot.remainder=0;
  Attention.ensure(data,Number.isFinite(data.lastSync)?data.lastSync:Date.now());
  for(const entity of [...(data.social?.eggs||[]),...(data.social?.memorials||[])])migrateIndividual(entity?.snapshot);
  return data;
}

// Tres huevos a elegir en vez de un unico «huevo misterioso» a ciegas, y cada uno ensena el tipo de
// lo que saldra. El sorteo cuelga del ID del compañero que acaba de morir, asi que recargar la
// pagina NO rebaraja: si lo hiciera bastaria con recargar hasta sacar el tipo que uno quiere, que es
// azar de salida. Y al derivarse de algo que ya esta en la partida, el esquema de save 12 no se toca.
const BEGINNING_CHOICES=3;
// Piedad sobre la rareza del comienzo. Medido sin ella: un 20,3 % de probabilidad de tres comienzos
// seguidos de baja calidad, y un 6,9 % de las rachas duran seis o mas. Eso es lo que se percibe como
// injusto, y la piedad corta lo arregla casi gratis (el 5* pasa de 1,1 % a 1,8 %).
// La garantia dura va a 40 y no a 10 a proposito: a 10 el 5* se dispara al 9,9 % y, con un unico
// legendario en el repertorio, "un 5* garantizado" es "el mismo legendario cada dos semanas". A 40
// queda en 3,4 %. El contador avanza UNA vez por comienzo, no por huevo ofrecido.
// La rareza que la piedad obliga a ofrecer, o null si esta tirada va sin red.
function pityTier(rng){
  if(state.pity.since>=PITY_CONFIG.hardAfter)return 5;
  if(state.pity.low<PITY_CONFIG.shortAfter)return null;
  let roll=rng();
  for(const [tier,share] of PITY_CONFIG.slice){roll-=share;if(roll<0)return tier;}
  return PITY_CONFIG.slice.at(-1)[0];
}
// La racha mide lo MEJOR que se llego a ofrecer: si el jugador tenia un 4* delante y eligio un 1*,
// eso es una decision suya y no mala suerte.
function recordPity(offered){
  const best=Math.max(...offered.map(id=>PokemonData.get(id)?.Rarity||1));
  if(best>=5){state.pity=freshPity();return;}
  state.pity.since+=1;
  state.pity.low=PITY_CONFIG.low.includes(best)?state.pity.low+1:0;
}
const seededRandom=text=>{let seed=[...String(text)].reduce((n,c)=>(n*31+c.charCodeAt(0))>>>0,2166136261);
  return ()=>((seed=(seed*1664525+1013904223)>>>0)/4294967296);};
function beginningChoices(){
  const rng=seededRandom(`${state.social.active.id}:beginning`),picked=[],types=new Set();
  // La piedad reserva UNA de las tres plazas; las otras dos se sortean como siempre. Si el
  // repertorio no tiene ninguna especie de esa rareza, la tirada sigue sin red en vez de fallar.
  const forced=pityTier(rng);
  if(forced!==null){
    const pool=STARTERS.filter(id=>PokemonData.get(id)?.Rarity===forced);
    if(pool.length){const chosen=Pokedex.choose(pool,state.pokedex,rng);picked.push(chosen);types.add(PokemonData.get(chosen).Type1);}
  }
  // Se sortea con `Pokedex.choose`, el mismo del huevo misterioso, para conservar el sesgo hacia las
  // especies que todavia no has tenido: elegir no deberia costarte el progreso de la Pokedex.
  // Y los tres tipos son distintos: lo unico que se enseña es el tipo, asi que dos huevos del mismo
  // tipo son dos opciones que el jugador no puede distinguir, o sea una eleccion de mentira. Con 26
  // raices en 11 tipos siempre salen tres; el respaldo sin filtro esta por si el repertorio encoge.
  const typeOf=id=>PokemonData.get(id).Type1;
  while(picked.length<BEGINNING_CHOICES){
    const fresh=STARTERS.filter(id=>!picked.includes(id)&&!types.has(typeOf(id)));
    const pool=fresh.length?fresh:STARTERS.filter(id=>!picked.includes(id));
    if(!pool.length)break;
    const chosen=Pokedex.choose(pool,state.pokedex,rng);
    picked.push(chosen);types.add(typeOf(chosen));
  }
  return picked;
}

// delante por todas las ramas, con el sprite estatico de Memorias en cada paso.

        for(const[k,v]of Object.entries(r.careMean))req(actionable&&mean(k)!==null&&mean(k)>=v,t('oak.requirement.average',{stat:stat(k),value:v}));
        for(const[k,v]of Object.entries(r.training))req(state.training[k]>=v,t('oak.requirement.stat',{stat:stat(k),value:v}));
        for(const c of r.sustained){const elapsed=state.sustained[sustainedKey(c)]||0;req(actionable&&state.care[c.estadistica]>=c.minimo&&elapsed>=c.duracionMs,t('oak.requirement.sustained',{stat:stat(c.estadistica),value:c.minimo,hours:c.duracionMs/HOUR,elapsed:(elapsed/HOUR).toFixed(1)}));}
        if(r.action)req(actionable&&(state.actions[r.action]||0)>=r.repetitions,t('oak.requirement.action',{action:evolutionActionLabel(r.action),current:actionable?(state.actions[r.action]||0):0,required:r.repetitions}));
        if(r.item)req(false,t('oak.requirement.item',{item:itemLabel(r.item),count:state.inventory[r.item]||0}));
        section.append(list);
      }
      content.append(section);
    }
    content.append(el('p',t('oak.itemFlow'),'panel-note'));if(state.milestones.length)content.append(el('p',t('oak.path',{path:state.milestones.map(m=>`${evolutionConfig[m.from]?.name||m.from} → ${evolutionConfig[m.to]?.name||m.to}`).join(' · ')}),'panel-note'));
}
// Ficha de especie con datos factuales del catalogo. Las entradas de Pokedex oficiales son texto
// creativo de terceros y no se pueden embarcar; esto es dato propio del proyecto.
function speciesFacts(id){
  const d=PokemonData.get(id);if(!d)return [];
  const care=t('dex.care.'+String(d.CareDifficulty));
  const rows=[
    [t('dex.fact.number'),String(d.DexNo)],
    [t('dex.fact.type'),[d.Type1,d.Type2].filter(Boolean).map(x=>t('type.'+x)).join(' · ')],
    [t('dex.fact.generation'),d.Generation],
    [t('dex.fact.stage'),t('evostage.'+d.EvolutionStage)],
    [t('dex.fact.rarity'),String(d.Rarity)],
    [t('dex.fact.care'),care],
    [t('dex.fact.eggGroup'),t('egggroup.'+d.EggGroup)],
    [t('dex.fact.gender'),d.Genderless?t('dex.fact.genderless'):t('dex.fact.genderRatio',{male:Math.round(d.MaleRatio*100),female:Math.round(d.FemaleRatio*100)})],
    ['',d.Breedable?t('dex.fact.breedable'):t('dex.fact.notBreedable')],
  ];
  return rows.filter(([,value])=>value!==undefined&&value!==null&&value!=='');
}
function speciesFactList(id){
  const list=el('dl',undefined,'dex-facts');
  for(const [label,value] of speciesFacts(id)){
    if(label)list.append(el('dt',label));
    list.append(el('dd',value));
  }
  return list;
}
function renderPokedex(){
  dialog.dataset.lcdSurface='true';disposeMemorialSprites();const content=$('panel-content');content.replaceChildren();$('panel-title').textContent=t(collectionTab==='companion'?'pokedex':'ui.inventory.collection');
  const tabs=el('nav',undefined,'social-flows');tabs.setAttribute('aria-label',t('ui.inventory.collection'));
  // Tres pestañas, con el compañero primero: es la consulta frecuente y no debe costar un scroll.
  // Sin esto la Pokédex heredaba el problema que estamos arreglando, porque la ficha del compañero
  // ya incluye la línea evolutiva completa, que son varias pantallas.
  for(const [id,label]of [['companion',t('dex.companionTab')],['pokedex',t('dex.tab')],['memories',t('memories.tab')]]){const button=socialButton(label,()=>{collectionTab=id;renderPokedex();});button.setAttribute('aria-pressed',String(collectionTab===id));tabs.append(button);}content.append(tabs);
  // Memorias no es un else: es la caida posterior al return de Especies, asi que esta pestaña
  // tambien tiene que salir por su cuenta o se pintarian las dos.
  if(collectionTab==='companion'){
    if(state.phase==='egg')content.append(el('p',t(state.heat<3?'oak.eggEarly':'oak.eggLate')));
    else renderCompanionTab(content);
    return;
  }
  if(collectionTab==='pokedex'){
    const variantTabs=el('nav',undefined,'social-flows');for(const [v,label]of [['normal',t('dex.normal')],['shiny',t('dex.shiny')]]){const b=socialButton(label,()=>{dexVariant=v;renderPokedex();});b.setAttribute('aria-pressed',String(dexVariant===v));variantTabs.append(b);}variantTabs.className='variant-tabs';content.append(variantTabs);if(dexVariant==='shiny'&&!Shiny.enabled)content.append(el('p',t('dex.shinyPending'),'panel-note'));
    const entries=Object.entries(state.pokedex).map(([id,e])=>[id,dexVariant==='shiny'?e.shiny:e]).filter(([,e])=>e?.seen);content.append(el('p',t('dex.summary',{count:entries.length,total:obtainableRoster.total,owned:entries.filter(([,e])=>e.ownedIds.length).length,memories:state.social.memorials.length}),'panel-note'));
    const completion=el('progress');completion.max=obtainableRoster.total;completion.value=entries.length;completion.setAttribute('aria-label',t('dex.progress',{count:entries.length,total:obtainableRoster.total}));content.append(completion);
    const grid=el('div',undefined,'dex-grid');
    for(const entry of obtainableRoster.dexOrder){
      const id=PokemonData.canonicalId(entry.id),e=entries.find(([key])=>key===id)?.[1];
      const card=el(e?'details':'article',undefined,'dex-tile');
      // Seen is not cared for: a form you only met through someone else's code stays a silhouette.
      if(e){const summary=el('summary');summary.append(collectionSprite(id,dexVariant==='shiny',!e.ownedIds.length),el('strong',PokemonData.get(id).DisplayName));card.append(summary,el('p',[t(e.ownedIds.length?'dex.owned':'dex.seen'),e.evolved&&t('dex.evolved'),e.bred&&t('dex.bred'),e.received&&t('dex.received')].filter(Boolean).join(' · ')),speciesFactList(id));}
      else{const mystery=el('div','???','memory-sprite unknown');mystery.setAttribute('aria-label',t('dex.unknownForm'));card.append(mystery,el('small',t('dex.unknown')));}
      grid.append(card);
    }content.append(grid);return;
  }
  content.append(el('p',t('memories.help'),'panel-note'));
  if(!state.social.memorials.length)content.append(el('p',t('memories.empty')));
  for(const memory of state.social.memorials){
    const snap=memory.snapshot,id=memory.canonicalSpeciesId||memory.speciesId,data=PokemonData.get(id);
    const card=el('article',undefined,'memory-card'),visual=memorialPortrait(id,memory.isShiny===true);
    const copy=el('div');copy.append(el('h3',`${data?.DisplayName||memory.speciesId} ${PokemonData.genderSymbol(snap.gender)}`));
    if(snap.nickname)copy.append(el('p',`“${snap.nickname}”`,'memory-nickname'));
    const hearts=el('div',undefined,'memory-hearts'),filled=Relationship.hearts({relationship:{points:memory.bond||0}});hearts.setAttribute('role','img');hearts.setAttribute('aria-label',t('memories.bond',{hearts:filled}));
    for(let i=0;i<5;i++)hearts.append(pixelIcon('kindness',i<filled?'':'empty'));copy.append(hearts);
    const hours=Math.floor(snap.age/HOUR);copy.append(el('p',t('memories.age',{days:Math.floor(hours/24),hours:hours%24})));
    copy.append(el('p',snap.vital?.deathCause==='natural'?t('memories.natural'):t('memories.unknown')));
    if(Number.isFinite(memory.diedAt))copy.append(el('p',new Date(memory.diedAt).toLocaleDateString(I18n.getLocale(),{day:'numeric',month:'short',year:'numeric'}),'subtle'));
    if(memory.frame)MemorialFrames.apply(card,memory.frame);
    // Un solo sitio donde salen monedas: el boton no cobra, lleva a la tienda con este recuerdo
    // seleccionado.
    copy.append(panelButton(t(memory.frame?'memories.changeFrame':'memories.addFrame'),
      ()=>{framingMemorialId=memory.id;showPanel('shop');},false,`frame-${memory.id.slice(-6)}`));
    card.append(visual,copy);content.append(card);
  }
}

function dispatch(callback,reaction=null){sync();const wasSick=state.pokerus,priorEvolution=evolutionSerial;const result=callback();Attention.evaluate(state);deliverAttention();save({immediate:!!result});render(true);if(result&&reaction&&evolutionSerial===priorEvolution&&!(state.pokerus&&!wasSick))petReaction(reaction);if(dialog.open)renderPanel();startTimer();}

$('close-panel').addEventListener('click',closePanel);dialog.addEventListener('close',()=>{disposeMemorialSprites();stopSocialCamera();panelName=null;});
// Tapping the backdrop dismisses the menu. A modal dialog's backdrop reports the dialog itself as
// the target, so the pointer has to fall outside its box; requiring the press to start there too
// keeps a selection that drifts out from closing the panel. #training-game is deliberately absent:
// a minigame only ends through its own controls.
const outsidePanel=event=>{const box=dialog.getBoundingClientRect();
  return event.target===dialog&&(event.clientX<box.left||event.clientX>box.right||event.clientY<box.top||event.clientY>box.bottom);};
let backdropPress=false;
dialog.addEventListener('pointerdown',event=>{backdropPress=outsidePanel(event);});
dialog.addEventListener('click',event=>{const press=backdropPress;backdropPress=false;if(press&&outsidePanel(event))closePanel();});
$('oak-portrait').addEventListener('click',()=>unlockAdminCheats());
function resetGame(){
  if(!canUseTesting())return false;
  TrainingActivities.cancel();
  stopSocialCamera();cancelBirthAnimation();hideToast();clearPetReaction();lastDeathId=null;pokemonRenderer.stop();pokemonMode=false;$('creature-button').classList.remove('heat-reaction');
  if(timer!==null)clearInterval(timer);timer=null;
  if(dialog.open)closePanel();
  for(const id of ['nickname-dialog','found-dialog'])if($(id).open)$(id).close();
  storageWarning='';
  try{gameStorage.removeItem(SAVE_KEY);gameStorage.removeItem(`${SAVE_KEY}.before-table-replacement`);gameStorage.removeItem(`${SAVE_KEY}.before-canonical-v2`);gameStorage.removeItem(`${SAVE_KEY}.before-vital-c`);}
  catch{storageWarning=t('system.resetStorageFailed');}
  state=freshState();lastMessage=state.message;
  render();startTimer();$('creature-button').focus();
}

window.addEventListener('pageshow',()=>{if(!runtimeStopped&&!document.hidden){resumeEggVisuals();render();}});
document.addEventListener('visibilitychange',()=>{if(runtimeStopped)return;if(document.hidden){TrainingActivities.cancel(true);stopSocialCamera();clearPetReaction();suspendEggVisuals();sync();save();}else{resumeEggVisuals();sync();save();render();if(dialog.open)renderPanel();startTimer();}});
restore();
window.HatchRuntime={save,applyCloudSave(game,preferences={}){try{game=migrateSave(game);if(runtimeStopped||!validSave(game))return false;}catch{return false;}state=game;savedImportantState=null;displayMode=preferences.displayMode==='lcd'?'lcd':'color';try{gameStorage.setItem(LANGUAGE_PREFERENCE_KEY,preferences.language==='en'?'en':'es');I18n?.setLanguage(preferences.language==='en'?'en':'es');}catch{}$('display-root').dataset.displayMode=displayMode;ShellSkins.hydrate(preferences.shells,$('display-root'));hideToast();clearPetReaction();sync();render();if(dialog.open)renderPanel();return true;},stop(){runtimeStopped=true;lockAdminCheats();clearInterval(timer);timer=null;TrainingActivities.cancel(true);stopSocialCamera();cancelBirthAnimation();hideToast();clearPetReaction();pokemonRenderer.stop();eggController.stop();disposeMemorialSprites();for(const id of ['panel','training-game','nickname-dialog','found-dialog'])if($(id).open)$(id).close();}};
save();lastMessage=state.message;render();startTimer();
